.qform{margin-top:18px}.qsection{border:1px solid #dce3ed;border-radius:14px;padding:18px;margin:18px 0;background:#fff}.qsection h3{margin:0 0 14px;color:var(--navy);font-size:19px}.qmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.qfield label{display:block;font-weight:800;font-size:13px;margin-bottom:6px;color:var(--navy)}.qfield input{width:100%;padding:11px 12px;border:1px solid #cfd7e5;border-radius:9px;font:inherit}.qitem{border-top:1px solid #e5eaf2;padding:15px 0}.qitem:first-of-type{border-top:0}.qtitle{font-weight:700;line-height:1.45}.qpts{color:var(--blue);font-weight:800;font-size:13px;margin-top:5px}.qchoices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.qchoice{border:1px solid #cfd7e5;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700}.qchoice.selected{background:#e9f8f0;border-color:#198754;color:#11663d}.qchoice.bad.selected{background:#fff0f1;border-color:#dc3545;color:#a61e2a}.qchoice.partial.selected{background:#fff8e6;border-color:#d6a51d;color:#8a6400}.qscorebar{position:sticky;top:10px;z-index:3;background:linear-gradient(135deg,#071a3d,#0b5ed7);color:#fff;border-radius:14px;padding:16px 18px;margin:0 0 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.qscore{font-size:28px;font-weight:900}.qstatus{font-weight:800}.qfail{background:#7f172a}.qnotes textarea{min-height:90px}.qactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.qbtn{border:0;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}.qbtn.primary{background:var(--blue);color:#fff}.qbtn.secondary{background:#e8edf5;color:#26344d}.qbtn.print{background:#198754;color:#fff}.reserved{opacity:.55;cursor:not-allowed}@media(max-width:800px){.qscorebar{position:static;align-items:flex-start;flex-direction:column}}</style>

<script>
const P=[
/* M1 */
{m:0,e:"MODULE 1 • CSR EXCELLENCE",t:"CSR Excellence Training",b:`<div class="hero"><h2>Welcome to CSR Excellence</h2><p>Your role is more than answering a call. Every interaction is an opportunity to create confidence, reduce customer effort, and represent the dealership professionally.</p></div><h2>Learning Objectives</h2><ul><li>Understand the purpose of a Customer Service Representative (CSR).</li><li>Recognize behaviors that create a professional customer experience.</li><li>Use clear, confident, and customer-focused communication.</li><li>Apply a consistent structure from greeting through close.</li></ul><div class="activity"><b>Think About It:</b><p>What makes a customer feel that the person helping them genuinely cares?</p><textarea placeholder="Write your thoughts here..."></textarea></div>`},
{m:0,e:"MODULE 1 • LESSON 1",t:"The CSR Mindset",b:`<h2>Think Like the Customer</h2><p>A strong CSR approaches every conversation with three priorities:</p><div class="grid"><div class="mini"><strong>Listen</strong>Understand what the customer is actually asking for before jumping to a solution.</div><div class="mini"><strong>Clarify</strong>Ask focused questions when information is missing or unclear.</div><div class="mini"><strong>Guide</strong>Explain the next best step in a simple, confident way.</div></div><p><b>Key principle:</b> Customers should not have to work harder than necessary to get help. For the Dealership Scheduling Team, that means taking ownership of the scheduling-related request, verifying the details, and clearly explaining what happens next.</p>`},
{m:0,e:"MODULE 1 • LESSON 2",t:"Professional Communication",b:`<h2>Words Create the Experience</h2><p>Professional communication should be clear, respectful, concise, and natural.</p><div class="grid"><div class="mini"><strong>Use</strong>“I can help with that.”<br>“Let me check that for you.”<br>“Here’s what we can do next.”</div><div class="mini"><strong>Avoid</strong>“I don't know.”<br>“That's not my department.”<br>“You need to…”</div></div><p>When you do not know an answer, own the next step rather than guessing.</p>`},
{m:0,e:"MODULE 1 • LESSON 3",t:"Call Structure",b:`<h2>A Consistent Call Flow</h2><ol><li><b>Open professionally</b></li><li><b>Listen</b></li><li><b>Discover</b></li><li><b>Assist</b></li><li><b>Confirm</b></li><li><b>Close</b></li></ol><div class="scenario"><b>Practice:</b> A customer calls asking whether a vehicle is available. Confirm the vehicle details and determine what the customer wants to do next.</div>`},
{m:0,e:"MODULE 1 • CHECKPOINT",t:"Knowledge Check",q:"A customer says, “I’ve already called twice. But no one called me, you guys keep promising to call me back.” As a Dealership Scheduling Team CSR, what is the best response?",o:["“I’m sorry, but we’re very busy. You’ll have to wait for someone to call you back.”","“I understand why you’re frustrated. Let me review what has happened, verify the request, and make sure we take the appropriate next step rather than asking you to keep calling back.”","“If no one called you back, there’s nothing I can do from Scheduling.”","“I can guarantee someone will call you back today.”"],a:1,w:"The strongest response acknowledges the customer’s frustration, takes ownership within the Scheduling Team’s role, verifies the situation, and gives the customer a clear next step without making an unsupported promise."},
{m:0,e:"MODULE 1 • PRACTICE",t:"Customer Experience Scenario",b:`<h2>Put the Mindset Into Practice</h2><div class="scenario"><b>Scenario:</b> “I’ve already called twice. But no one called me, you guys keep promising to call me back.”</div><p>Write a response that shows empathy, ownership, and a clear next step while following the responsibilities of the Dealership Scheduling Team.</p><textarea placeholder="Type your response..."></textarea><div class="activity"><b>Suggested structure:</b> Acknowledge → reassure → clarify → act → confirm.</div>`},
{m:0,e:"MODULE 1 • FINAL CHECK",t:"Module 1 Knowledge Check",q:"Which behavior best demonstrates CSR excellence?",o:["Keeping the call as short as possible regardless of the customer's need.","Giving the customer an answer even when you are not sure it is correct.","Listening carefully, communicating clearly, and guiding the customer to the next step.","Avoiding questions so the customer can explain everything without interruption."],a:2,w:"CSR excellence combines listening, clarity, accuracy, ownership, and helpful guidance."},
{m:0,e:"MODULE 1 • TEAM ACTIVITY",t:"5-Minute Excellence Challenge",b:`<h2>Practice</h2><p>With a partner, create a short opening for a customer call. Include a professional greeting, an offer to help, and a natural transition into discovering the customer's need.</p><div class="activity"><b>Share:</b> Be ready to explain why your opening creates a positive customer experience.</div>`},
{m:0,e:"MODULE 1 • WRAP-UP",t:"Module 1 Summary",b:`<h2>Remember the Standard</h2><div class="grid"><div class="mini"><strong>Listen</strong>Understand before responding.</div><div class="mini"><strong>Communicate</strong>Be clear, respectful, and confident.</div><div class="mini"><strong>Own It</strong>Take responsibility for the next step.</div><div class="mini"><strong>Confirm</strong>Make sure the customer knows what happens next.</div></div>`},

/* M2 */
{m:1,e:"MODULE 2 • DIFFICULT CUSTOMERS",t:"Handling Difficult Customers",b:`<div class="hero"><h2>Turning Tension Into Trust</h2><p>Difficult conversations are part of customer service. The goal is not to “win” an argument. The goal is to lower tension, understand the concern, and move the conversation toward a workable next step.</p></div><h2>Learning Objectives</h2><ul><li>Recognize common causes of customer frustration.</li><li>Use empathy without making promises you cannot keep.</li><li>De-escalate tense conversations.</li><li>Set respectful boundaries when necessary.</li><li>Move from emotion to resolution.</li></ul>`},
{m:1,e:"MODULE 2 • LESSON 1",t:"Why Customers Become Difficult",b:`<h2>Look Beneath the Emotion</h2><p>Frustration can come from long wait times, repeated contacts, unclear expectations, a perceived lack of progress, or a problem that feels urgent to the customer.</p><div class="grid"><div class="mini"><strong>Emotion</strong>“This is ridiculous!”</div><div class="mini"><strong>Need</strong>“I need to know what is happening.”</div><div class="mini"><strong>Goal</strong>“Give me a clear next step.”</div></div><p>Do not mirror anger. Stay calm and focus on the need behind the words.</p>`},
{m:1,e:"MODULE 2 • LESSON 2",t:"The De-escalation Formula",b:`<h2>CALM: A Simple Response Model</h2><div class="grid"><div class="mini"><strong>C — Connect</strong>Acknowledge the customer's frustration.</div><div class="mini"><strong>A — Ask</strong>Clarify what happened and what the customer needs.</div><div class="mini"><strong>L — Lead</strong>Explain what you can do and what happens next.</div><div class="mini"><strong>M — Make sure</strong>Confirm understanding and close professionally.</div></div>`},
{m:1,e:"MODULE 2 • LESSON 3",t:"Empathy Without Overpromising",b:`<h2>Show Understanding — Stay Accurate</h2><p>Empathy does not mean agreeing with every accusation or promising an outcome you cannot control.</p><div class="grid"><div class="mini"><strong>Good</strong>“I understand why you’re concerned. Let me verify what I can do.”</div><div class="mini"><strong>Risky</strong>“I guarantee this will be fixed today.”</div></div>`},
{m:1,e:"MODULE 2 • CHECKPOINT",t:"Knowledge Check",q:"A customer is angry and speaking loudly. What should you do first?",o:["Raise your voice so the customer can hear you.","Interrupt and immediately explain why the customer is wrong.","Stay calm, acknowledge the concern, and listen for the underlying issue.","Tell the customer they must calm down before you will help."],a:2,w:"Calm tone + acknowledgment + listening helps reduce tension and identifies the real issue."},
{m:1,e:"MODULE 2 • LESSON 4",t:"Handling Objections & Pushback",b:`<h2>Don't Fight the Objection</h2><ol><li><b>Acknowledge:</b> “I understand your concern.”</li><li><b>Clarify:</b> “Can I ask what part concerns you most?”</li><li><b>Respond:</b> Address the specific concern with accurate information.</li><li><b>Redirect:</b> Move toward the next useful action.</li></ol>`},
{m:1,e:"MODULE 2 • LESSON 5",t:"Setting Respectful Boundaries",b:`<h2>Professional Even Under Pressure</h2><p>Keep language calm and professional. Follow your organization's escalation procedures when a situation requires supervisor or management involvement.</p><div class="scenario"><b>Example:</b> “I want to help resolve this. I can continue working with you, but I need us to keep the conversation respectful.”</div>`},
{m:1,e:"MODULE 2 • PRACTICE",t:"Difficult Customer Scenario",b:`<div class="scenario">“I’ve called three times and I’m still getting the same answer. Nobody is helping me!”</div><p>Choose the strongest opening response:</p><div id="sopts"><button class="option" onclick="sp(this,false)">“There’s nothing else I can do. You’ll have to wait.”</button><button class="option" onclick="sp(this,true)">“I understand you’re frustrated. Let me review what has happened so far so I can identify the next step.”</button><button class="option" onclick="sp(this,false)">“You need to calm down before we can continue.”</button></div><div id="sf" class="feedback"></div>`},
{m:1,e:"MODULE 2 • FINAL CHECK",t:"Module 2 Final Check",q:"What is the primary goal when handling a difficult customer?",o:["Prove that the CSR is right.","End the call as quickly as possible.","Reduce tension, understand the concern, and move toward an appropriate resolution.","Agree to every demand to keep the customer happy."],a:2,w:"Effective de-escalation balances empathy, accuracy, boundaries, and a clear path forward."},
{m:1,e:"MODULE 2 • ROLE PLAY",t:"10-Minute Role Play",b:`<h2>Practice</h2><p>Work in pairs. One person is the customer and one is the CSR.</p><ul><li>Round 1: Customer is frustrated about having to repeat information.</li><li>Round 2: Customer believes nobody is taking ownership.</li><li>Round 3: Customer disagrees with the available next step.</li></ul><div class="activity"><b>Observer checklist:</b> Did the CSR acknowledge emotion? Ask a clarifying question? Avoid arguing? Explain a next step? Confirm understanding?</div>`},
{m:1,e:"MODULE 2 • WRAP-UP",t:"Module 2 Summary",b:`<h2>Remember CALM</h2><div class="grid"><div class="mini"><strong>Connect</strong>Acknowledge the concern.</div><div class="mini"><strong>Ask</strong>Find the real issue.</div><div class="mini"><strong>Lead</strong>Explain the next step.</div><div class="mini"><strong>Make sure</strong>Confirm understanding.</div></div>`},

/* M3 — source-derived DealerFocus Script */
{m:2,e:"MODULE 3 • DEALERFOCUS CALL FLOW & SCRIPT",t:"DealerFocus Call Flow & Script",b:`<div class="hero"><h2>Inbound Script</h2><p><b>Source:</b> DealerFocus Script — April 27, 2022</p><p>This module presents the supplied DealerFocus script for training and practice.</p></div><div class="grid"><div class="mini"><strong>Appointment Script</strong>Use the supplied sequence for service scheduling.</div><div class="mini"><strong>Reschedule Appointment</strong>Follow the supplied rescheduling flow.</div><div class="mini"><strong>General Question</strong>Use the supplied vehicle-status process.</div><div class="mini"><strong>Honda & Acura Mystery Shop</strong>Review the required keywords and approved spiels for Honda/Acura Mystery Shop calls.</div></div>`},
{m:2,e:"MODULE 3 • APPOINTMENT SCRIPT",t:"Appointment Script",b:`<div class="script"><div class="opening">OPENING STATEMENT: Good morning | afternoon,<br>Thank You For Calling (Dealership_ Name) Service Scheduling, This is (Your First Name) how can I help you?</div><ol><li>My Pleasure, May I have the number associated with your account? Am I speaking with….</li><li>Confirm Model and Ask the customer for Mileage</li><li>May I have the service that is needed?</li><li>Besides (confirm service) do you have any additional concerns?</li><li>(Depending on policy restriction) “Will you be dropping your vehicle off and leaving it for the day?”</li><li>My next available appointment is on (date and time)?</li><li>(confirmed email) I will send you a confirmation of your appointment.</li><li>Mr. or Mrs. customer_last_name your “check in time is on (date and time) for (confirm service).</li><li>If for any reason you need to reschedule or cancel your appointment, give us a call.</li></ol><div class="closing">CLOSING STATEMENT: Thank you for calling (Dealership Name) Have a Great Day !!!</div></div><div class="activity"><b>Practice:</b> Read the complete appointment flow aloud with a partner.</div>`},
{m:2,e:"MODULE 3 • RESCHEDULE",t:"Reschedule Appointment Script",b:`<div class="script"><div class="opening">OPENING STATEMENT: Good morning | afternoon,<br>Thank You For Calling (Dealership_ Name) Service Scheduling, This is (Your First Name) how I can help you?</div><p><b>Customer:</b> “I need to reschedule my appointment”</p><ol><li>My Pleasure, I will be happy to assist you with your request.</li><li>May (Not Can) I have the phone number associated with the vehicle?</li><li>(Confirm the customer’s name and vehicle information)</li><li>I see you are scheduled for (Confirm the date, time, and services)</li><li>May I have the new date and time you would like to change your appointment to?</li><li>(confirmed email) I will send you a confirmation of your appointment.</li><li>Mr. or Mrs. customer_last_name your “check in time is on (date and time) for (confirm service).</li><li>If for any reason you need to reschedule or cancel your appointment, give us a call.</li></ol><div class="closing">CLOSING STATEMENT: Thank you for calling (Dealership Name) Have a Great Day !!!</div></div>`},
{m:2,e:"MODULE 3 • GENERAL QUESTION",t:"General Question Script",b:`<div class="script"><div class="opening">OPENING STATEMENT: Good morning | afternoon,<br>Thank You For Calling (Dealership_ Name) Service Scheduling, This is (Your First Name) how I can help you?</div><p><b>Customer:</b> “I need to know if my car is ready?”</p><ol><li>My Pleasure, I will be happy to assist you with your request.</li><li>May (Not Can) I have the phone number associated with the vehicle?</li><li>Am I speaking too (Confirm the customer’s name) calling in regards to (Year and Model)?</li><li>I will be happy to call over to service to see if your car is ready, please hold</li></ol><p><b>Speaking with Service:</b></p><ol start="5"><li>“Hi, this is (your name) from scheduling I have (customer name) on the line looking for a status check of his or her car”?</li><li>Service: Transfer them</li><li>Mr. or Mrs. customer_last_name, I have service on the line, I will go ahead and disconnect the line.</li></ol><div class="closing">CLOSING STATEMENT: Have a Great Day !!!</div></div>`},
{m:2,e:"MODULE 3 • NO REPLY FROM SERVICE",t:"No Reply from Service — Hot Alert",b:`<div class="script"><p><b>No Reply from Service:</b> no answer after 3 rings -send Hot Alert</p><p><b>5.</b> “Thank you for holding Mr. or Mrs. customer_last_name, I was unable to reach service. What I will do is send your request over to them for a callback.</p><div class="closing">CLOSING STATEMENT: Thank you for calling (Dealership Name) Have a Great Day !!!</div></div><div class="activity"><b>Important:</b> Practice the difference between the “Speaking with Service” path and the “No Reply from Service” path.</div>`},
{m:2,e:"MODULE 3 • HONDA & ACURA MYSTERY SHOP",t:"Honda and Acura Mystery Shopper Spiel",b:`<div class="scenario"><b>Mystery Shop Notice:</b><p>Honda and Acura Corporate will be conducting "Mystery Shop Calls." There is a certain script we need to follow. Below are the keywords to mention on the call, along with the approved call spiels.</p></div><h2>Keywords to Mention</h2><ul><li>Express Service/s</li><li>Honda / Acura Oil and Filter Change</li><li>Honda / Acura "Certified" Technician</li><li>Honda / Acura Oil or Genuine Part</li></ul><h2>Diagnostics — Scheduled Appointment</h2><div class="script"><div class="opening">OPENING SPIEL: "We can schedule an appointment with one of our Honda Certified Technicians to diagnose the issue."</div><div class="closing">CLOSING SPIEL: "We have you scheduled with one of our Honda Certified Technicians to diagnose your car on Tuesday, Nov 1st. Your check-in time is at 8AM drop off."</div></div><h2>Service Appointment — Scheduled Appointment</h2><div class="script"><div class="opening">OPENING SPIEL: "We can schedule an appointment with one of our Honda Certified Technicians to diagnose the issue."</div><div class="closing">CLOSING SPIEL: "We've scheduled your Honda oil and filter change and (other services) on Monday, Nov 7th. Your check-in time with our Honda Certified Technician is at 9AM."</div></div><h2>Walk-Ins — No Appointment Necessary</h2><div class="script"><p><b>Customer:</b> "I'd like to book an appointment for an oil change."</p><div class="opening">AGENT (OPENING SPIEL): "My pleasure to assist. For Express Services, we accept walk-ins from 8AM–5PM. Do you have any other concerns aside from getting the Honda Oil and Filter Change?"</div></div><div class="activity"><b>Points to Ponder:</b><ul><li>The Mystery Shop Spiel is found in the Appointment Settings section.</li><li>Always check the Express Service category on the policy for walk-ins.</li><li>Check banners for any important updates and restrictions.</li></ul></div>`},
{m:2,e:"MODULE 3 • KNOWLEDGE CHECK",t:"DealerFocus Script Check",q:"In the supplied Appointment Script, what should the CSR ask for after confirming the model and asking for mileage?",o:["The customer's job title","The service that is needed","The customer's state capital","A vehicle color"],a:1,w:"The supplied Appointment Script lists: “May I have the service that is needed?”"},
{m:2,e:"MODULE 3 • PRACTICE",t:"Script Role-Play",b:`<h2>DealerFocus Script Practice</h2><p>Partner A is the customer. Partner B is the CSR. Practice one of the three supplied call types:</p><ul><li>Appointment</li><li>Reschedule Appointment</li><li>General Question / vehicle-ready status</li></ul><div class="activity"><b>Trainer check:</b> Follow the supplied sequence, use the supplied wording where applicable, and identify which path the call takes.</div><textarea placeholder="Trainer notes / practice feedback..."></textarea>`},
{m:2,e:"MODULE 3 • WRAP-UP",t:"Module 3 Summary",b:`<h2>DealerFocus Script — Key Paths</h2><div class="grid"><div class="mini"><strong>Appointment</strong>Gather account/vehicle information, service need, additional concerns, appointment details, confirmation, and closing.</div><div class="mini"><strong>Reschedule</strong>Confirm the vehicle/customer information and existing appointment, obtain the new date/time, confirm details, and close.</div><div class="mini"><strong>General Question</strong>Confirm the caller and vehicle, contact service, then follow either the transfer path or the no-reply Hot Alert/callback path.</div></div><p class="source-note">Module 3 wording is based on the uploaded DealerFocus Script document.</p>`},
{m:3,e:"MODULE 4 • HOT ALERT & DISPOSITION",t:"Hot Alert & Disposition",b:`<div class="hero"><h2>Escalate Right. Log It Right.</h2><p>When a call cannot be completed the normal way, or needs urgent follow-up, a Hot Alert keeps the customer from falling through the cracks. Every call also needs an accurate disposition so the dealership and DealerFocus have a clean record of what happened and what happens next.</p></div><h2>Learning Objectives</h2><ul><li>Recognize when a situation calls for a Hot Alert.</li><li>Send a Hot Alert using the correct wording and information.</li><li>Understand the purpose of call dispositions.</li><li>Select the disposition that accurately reflects the outcome of the call.</li></ul>`},
{m:3,e:"MODULE 4 • LESSON 1",t:"What Is a Hot Alert?",b:`<h2>Definition</h2><p>A Hot Alert is an internal, time-sensitive notice sent to the dealership (usually Service) when a customer's request could not be completed live on the call and needs a fast follow-up.</p><h2>Common Hot Alert Triggers</h2><div class="grid"><div class="mini"><strong>No Reply from Service</strong>No answer after 3 rings when attempting a transfer or warm handoff.</div><div class="mini"><strong>Urgent Customer Concern</strong>The customer describes a safety issue or time-sensitive vehicle problem.</div><div class="mini"><strong>Unresolved Callback Promise</strong>A customer says they were already promised a callback that never happened.</div></div><div class="scenario"><b>Reminder:</b> A Hot Alert does not replace giving the customer a clear next step. Always tell the customer what you are doing before you send it.</div>`},
{m:3,e:"MODULE 4 • LESSON 2",t:"Sending the Hot Alert",b:`<h2>What to Include</h2><ul><li>Customer's full name and best callback number.</li><li>Vehicle details, if relevant to the request.</li><li>A short, factual reason for the alert (e.g., "No answer from Service after 3 rings").</li><li>What the customer was told would happen next.</li></ul><h2>Sample Wording — No Reply from Service</h2><div class="script"><p><b>No Reply from Service:</b> no answer after 3 rings — send Hot Alert</p><p><b>Agent to customer:</b> "Thank you for holding, Mr./Mrs. customer_last_name. I was unable to reach Service. What I will do is send your request over to them for a callback."</p><div class="closing">CLOSING STATEMENT: "Thank you for calling (Dealership Name). Have a great day!"</div></div><h2>Sample Wording — Recall / Policy Item Booked (HOT-Successful)</h2><div class="script"><p><b>Example alert copy:</b></p><p>"Good day, Mrs. Smith has an open recall for airbag appointment on her 2009 Nissan Rogue and is set to drop off on 3/5/22 at 8AM. VIN 124dsjfckid12."</p></div><div class="activity"><b>Important:</b> Keep the alert factual and specific — customer name, vehicle, VIN when it's a recall, date/time, and the reason. Avoid vague notes like "customer called" — the person reading it later needs enough detail to act without calling the customer back to ask what happened.</div>`},
{m:3,e:"MODULE 4 • LESSON 3",t:"Core Call Dispositions",b:`<h2>Why Dispositions Matter</h2><p>The disposition is the label attached to a call after it ends. It tells the dealership and DealerFocus, at a glance, what actually happened — without anyone needing to relisten to the recording.</p><h2>Standard Outcomes</h2><div class="grid"><div class="mini"><strong>Successful Appointment</strong>An appointment was scheduled successfully and the customer's info (Name, Email, Phone #) was added into the DealerFocus software.</div><div class="mini"><strong>No Appointment</strong>An appointment could NOT be made for any reason — e.g. the offered day/time doesn't work and the customer will call back, or they need to check a calendar or another driver's schedule first. Also covers a Dealership Policy Request that is Not Offered at This Dealership.</div><div class="mini"><strong>General Inquiry</strong>The customer's question was answered without booking an appointment — service pricing, hours of operation, dealership address, confirming an existing appt date/time, checking/fixing an email on file, or adding/removing a service.</div><div class="mini"><strong>Transfer to Department</strong>The customer requested a specific department, person, or need (e.g. pricing or warranty); you reached someone, handed the customer off, and hung up the line.</div><div class="mini"><strong>Reschedule Appointment</strong>The customer called to change an existing appointment's date and time.</div><div class="mini"><strong>Cancelled Appointment</strong>The customer does not want to rebook on another day.</div></div>`},
{m:3,e:"MODULE 4 • LESSON 4",t:"Policy & Hot Alert Dispositions",b:`<h2>Hot Info — Notifies Service by Email</h2><div class="grid"><div class="mini"><strong>Policy Request — DO NOT BOOK, Send Hot Alert</strong>For items like Accessory, Loaner, Other Makes, Rental. If policy says these should be booked, still send a Hot Alert with the appointment details, noting the customer needs to reschedule the original appointment.</div><div class="mini"><strong>Customer Request (Hot Info)</strong>Use when you're unable to reach a department/person or get an answer, and the customer does not want to book an appointment — pricing not in the policy, warranty, or a specific person in Service.</div><div class="mini"><strong>Management Escalation / Call Back</strong>For anything else out of your hands, or an irate customer: get a DealerFocus manager first, then send the communication to Service per manager approval. Always include the reason for the call back. If someone other than the account holder is calling (spouse, parent), include their name; if a callback is requested on an alternate number, include that number.</div><div class="mini"><strong>HOT: Successful Appointment (Hot-Successful)</strong>Policy Request — BOOK, Send Hot Alert with appointment details (Accessory, Loaner, Recall, Other Makes, Rental). Use when you couldn't reach a department/person for an answer, but the appointment was still scheduled.</div><div class="mini"><strong>HOT — Recall</strong>When policy says DO NOT BOOK–SEND HOT ALERT (appointment can't be scheduled), or Service already booked it but the customer needs to reschedule. Always include the VIN #.</div><div class="mini"><strong>Successful — Transfer</strong>The appointment was scheduled successfully, and the customer also had a question for Service or Parts (pricing, duration, warranty, or their advisor) that you warm-transferred successfully.</div></div>`},
{m:3,e:"MODULE 4 • LESSON 5",t:"Call Status Dispositions",b:`<h2>When the Line Itself Is the Issue</h2><div class="grid"><div class="mini"><strong>Line Unresponsive</strong>You answer and hear nothing, or hear music playing. Before hanging up, say on the recording: "This line has become unresponsive, if you require further assistance please call us back." Also covers a caller getting disconnected mid-call, or hanging up during a warm transfer.</div><div class="mini"><strong>Dropped Call</strong>Use when you hear the dropped-call/end-call sound indicating the customer disconnected — this may be a lost connection or the customer intentionally hanging up.</div><div class="mini"><strong>Music Playing</strong>You answer and music is playing (wait 5–10 seconds max). This typically means another agent's transfer went unanswered and the line routed back to DealerFocus.</div></div>`},
{m:3,e:"MODULE 4 • LESSON 6",t:"Walk-In & Status-Check Dispositions",b:`<div class="grid"><div class="mini"><strong>Oil Change | Walk-In</strong>Use when dealership policy allows customers to walk in without an appointment for Express Service or a basic oil change.</div><div class="mini"><strong>State Inspection | Walk-In</strong>Use when dealership policy is strictly first-come, first-served — no appointment is required.</div><div class="mini"><strong>Transfer Status Check</strong>You successfully transferred the customer to Service for a status check. (Do not use "Transfer to Department" for this anymore.)</div><div class="mini"><strong>Hot-Status Check</strong>You're unable to reach Service for a status update on the customer's car, so you send a message over to Service instead.</div></div><p class="source-note">Dispositions on this and the previous two slides are sourced from the "Dispositions and Meaning" reference deck.</p>`},
{m:3,e:"MODULE 4 • SCENARIO",t:"Which Disposition?",b:`<div class="scenario"><b>Scenario:</b> You scheduled a customer's oil change appointment successfully. Before hanging up, the customer also asks about warranty coverage, so you warm-transfer them to Service and the transfer connects successfully.</div><div class="activity"><b>Think it through:</b><p>Which disposition should you select for this call, and why isn't "Transfer to Department" the right choice here?</p><textarea placeholder="Write your response here..."></textarea></div>`},
{m:3,e:"MODULE 4 • CHECKPOINT",t:"Module 4 Knowledge Check",q:"A customer's appointment was booked successfully, but they also needed pricing info from Parts, and you successfully warm-transferred them. Which disposition should you select?",o:["Successful Appointment","Successful — Transfer","Transfer to Department","General Inquiry"],a:1,w:"Successful — Transfer is used when the appointment was booked successfully AND the customer had a separate question for Service or Parts that was warm-transferred successfully. \"Transfer to Department\" is for when there was no appointment booked at all."},
{m:3,e:"MODULE 4 • WRAP-UP",t:"Module 4 Summary",b:`<h2>Hot Alert & Disposition — Key Takeaways</h2><div class="grid"><div class="mini"><strong>Hot Alert</strong>Used when a request can't be completed live and needs urgent internal follow-up. Must include customer info, reason, and next step — and a VIN for recall-related alerts.</div><div class="mini"><strong>Disposition</strong>The outcome label on every call. Must accurately reflect what happened — not what was intended. There are 18 standard dispositions covering successful, unsuccessful, hot alert, call-status, and walk-in outcomes.</div><div class="mini"><strong>Customer First</strong>Always tell the customer what's happening before you escalate, transfer, or end the call.</div></div><p class="source-note">Module 4 content is sourced from the DealerFocus Script and the "Dispositions and Meaning" reference deck.</p>`},
{m:4,e:"MODULE 5 • CALL QUALITY FORM",t:"DealerFocus Call Quality Form",form:true}
];

let cur=0,answered=false;
function quiz(p){return `<h2>${p.q}</h2>${p.o.map((x,i)=>`<button class="option" onclick="ans(this,${i},${p.a},${JSON.stringify(p.w)})">${x}</button>`).join("")}<div id="fb" class="feedback"></div>`}
function render(){let p=P[cur];let body=p.form?qualityForm():p.q?quiz(p):p.b;document.getElementById("content").innerHTML=`<div class="eyebrow">${p.e}</div><h1>${p.t}</h1>${body}<div class="controls"><button class="nav back" onclick="prev()" ${cur===0?"disabled":""}>← Back</button><button class="nav next" onclick="next()">${cur===P.length-1?"Finish":"Next →"}</button></div>`;document.getElementById("tag").textContent="Module "+(p.m+1);document.getElementById("count").textContent=(cur+1)+" / "+P.length;document.getElementById("fill").style.width=((cur+1)/P.length*100)+"%";document.querySelectorAll(".mod").forEach(x=>x.classList.toggle("active",+x.dataset.m===p.m));answered=false;if(p.form)initQualityForm()}
function ans(btn,i,a,w){if(answered)return;answered=true;document.querySelectorAll(".option").forEach((b,j)=>{if(j===a)b.classList.add("correct")});if(i!==a)btn.classList.add("wrong");document.getElementById("fb").textContent=(i===a?"✓ Correct! ":"✗ Not quite. ")+w}
function sp(btn,ok){document.querySelectorAll("#sopts .option").forEach(b=>b.classList.remove("correct","wrong"));btn.classList.add(ok?"correct":"wrong");document.getElementById("sf").textContent=ok?"✓ Strong response: it acknowledges frustration, takes ownership, and moves toward action.":"Try again. Avoid blame or dismissal; acknowledge the concern and focus on the next useful step."}

const QF={sections:[

{id:"q1",n:1,text:"Agent used proper branding — announced the dealership name?",pts:10,choices:["Yes — Full Points","No — 0 Points"],values:[10,0]},
{id:"q2",n:2,text:"Agent introduced themselves by name?",pts:10,choices:["Yes — Full Points","No — 0 Points"],values:[10,0]}]},
{title:"2 — Body of the Call",max:24,items:[
{id:"q3",n:3,text:"Agent asked the customer the reason for the transfer?",pts:8,choices:["Yes — Full Points","No — 0 Points"],values:[8,0]},
{id:"q4",n:4,text:"Agent asked for the customer's name to address them properly?",pts:8,choices:["Yes — Full Points","No — 0 Points"],values:[8,0]},
{id:"q5",n:5,text:"Agent introduced the customer to Service/Parts before transferring?",pts:8,choices:["Yes — Full Points","No — 0 Points"],values:[8,0]}]},
{title:"3 — System Process Accuracy",max:21,items:[
{id:"q6",n:6,text:"Warm transfer: agent used proper protocol? Hold 3 rings — wait for someone to answer before releasing",pts:8,choices:["Yes — Full Points","No — 0 Points"],values:[8,0]},
{id:"q7",n:7,text:"Input correct data in software? First and last name + phone number entered accurately",pts:5,choices:["Yes — Full Points","No — 0 Points"],values:[5,0]},
{id:"q8",n:8,text:"Correct call disposition selected in the system?",pts:8,choices:["Yes — Full Points","No — 0 Points"],values:[8,0]}]},
{title:"4 — Call Management Skills",max:35,items:[
{id:"q9",n:9,text:"Hold Procedure — Set expectation before placing on hold; explained reason for silence",pts:5,choices:["Yes","No","N/A"],values:[5,0,5]},
{id:"q10",n:10,text:"Communication & Delivery — Enunciates clearly; avoids jargon; speaks with fluidity",pts:5,choices:["Yes","No","Partial"],values:[5,0,2.5]},
{id:"q11",n:11,text:"Empathy — Acknowledged customer's emotion appropriately",pts:5,choices:["Yes","No","Partial"],values:[5,0,2.5]},
{id:"q12",n:12,text:"Active Listening — Avoided repetition; showed attention to detail",pts:5,choices:["Yes","No","Partial"],values:[5,0,2.5]},
{id:"q13",n:13,text:"Tone of Voice — Sounded accommodating and willing to help",pts:5,choices:["Yes","No","Partial"],values:[5,0,2.5]},
{id:"q14",n:14,text:"Efficiency — Was concise in delivering resolution to customer's concern",pts:5,choices:["Yes","No","Partial"],values:[5,0,2.5]},
{id:"q15",n:15,text:"Confidence — Sounded certain and accurate; assured the customer",pts:5,choices:["Yes","No","Partial"],values:[5,0,2.5]}]},
{title:"5 — Zero Tolerance Behavior",max:0,items:[
{id:"q16",n:16,text:"Rudeness — Used profanity or condescending statement; condescending tone; consistently interrupted customer",pts:0,choices:["Not observed","AUTO FAIL"],values:[0,"fail"]},
{id:"q17",n:17,text:"Service Fail — Booked when policy says Do Not Book (or vice versa); incorrect appt date/time; failure to confirm transportation option; or no appointment scheduled",pts:0,choices:["Not observed","AUTO FAIL"],values:[0,"fail"]},
{id:"q18",n:18,text:"Call Avoidance — Disconnecting calls intentionally",pts:0,choices:["Not observed","AUTO FAIL"],values:[0,"fail"]}]}]};
let qAnswers={};
function qualityForm(){return `<div class="qform"><div id="qscorebar" class="qscorebar"><div><div class="qscore" id="qscore">0 / 100</div><div class="qstatus" id="qstatus">Complete the evaluation to see the result.</div></div><div id="qfailnote"></div></div><div class="qsection"><h3>Call Information</h3><div class="qmeta"><div class="qfield"><label>Agent Name</label><input id="agentName" placeholder="Enter full name"></div><div class="qfield"><label>Call Date</label><input id="callDate" type="date"></div><div class="qfield"><label>Customer Name</label><input id="customerName" placeholder="Customer full name"></div><div class="qfield"><label>Customer Phone #</label><input id="customerPhone" placeholder="(555) 000-0000"></div><div class="qfield"><label>Dealership Name</label><input id="dealershipName" placeholder="Dealership"></div><div class="qfield"><label>Call Disposition</label><input id="callDisposition" placeholder="e.g. Warm Transfer – Service"></div></div></div>${QF.sections.map(s=>`<div class="qsection"><h3>${s.title} <span style="float:right;font-size:13px;color:var(--blue)">${s.max?s.max+" pts":"Auto Fail / PIP Enrollment if triggered"}</span></h3>${s.items.map(it=>`<div class="qitem" data-qid="${it.id}"><div class="qtitle">${it.n}. ${it.text}</div>${it.pts?`<div class="qpts">${it.pts} pts</div>`:""}<div class="qchoices">${it.choices.map((c,i)=>`<button type="button" class="qchoice ${it.values[i]==="fail"?"bad":""}" onclick="qSelect('${it.id}',${i})">${c}</button>`).join("")}</div></div>`).join("")}</div>`).join("")}<div class="qsection qnotes"><h3>Reason for Call</h3><textarea id="reasonCall" placeholder="Enter the reason for the call..."></textarea></div><div class="qsection qnotes"><h3>Agent Work-On (Coaching Notes)</h3><textarea id="agentWorkOn" placeholder="Enter coaching notes / areas for improvement..."></textarea><div class="qactions"><button class="qbtn secondary" onclick="resetQualityForm()">Reset Form</button><button class="qbtn print" onclick="window.print()">Print / Save PDF</button></div></div></div>`}
function initQualityForm(){qAnswers={};const d=document.getElementById("callDate");if(d)d.value=new Date().toISOString().slice(0,10);updateQualityScore()}
function qSelect(id,index){qAnswers[id]=index;const row=document.querySelector(`[data-qid="${id}"]`);if(row)row.querySelectorAll(".qchoice").forEach((b,i)=>b.classList.toggle("selected",i===index));updateQualityScore()}
function updateQualityScore(){let score=0,fail=false;QF.sections.forEach(s=>s.items.forEach(it=>{if(qAnswers[it.id]!==undefined){const v=it.values[qAnswers[it.id]];if(v==="fail")fail=true;else score+=Number(v||0)}}));const se=document.getElementById("qscore"),st=document.getElementById("qstatus"),bar=document.getElementById("qscorebar"),note=document.getElementById("qfailnote");if(!se)return;se.textContent=(fail?0:score)+" / 100";if(fail){bar.classList.add("qfail");st.textContent="AUTO FAIL — PIP Enrollment";note.textContent="Zero-tolerance behavior triggered."}else{bar.classList.remove("qfail");st.textContent=score===100?"Quality score complete.":"Evaluation in progress.";note.textContent=""}}
function resetQualityForm(){render()}
function next(){if(cur<P.length-1){cur++;render()}else alert("Training completed. Great work!")}
function prev(){if(cur>0){cur--;render()}}
function goModule(m){let i=P.findIndex(x=>x.m===m);if(i>=0){cur=i;render()}}
render();
</script>
